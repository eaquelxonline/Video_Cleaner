# Video Cleaner — her push'tan sonra Google Drive yedeği.
#
# GitHub hesabının kapanma riskine karşı Video_Cleaner_Beta dalına yapılan HER push'ta, kullanıcının kendi
# Drive hesabında çalışan Google Apps Script betiği (.github/scripts/drive_backup.gs) tetiklenir. Betik:
#   1. Son commit'in kaynak zip'ini GitHub'dan indirir,
#   2. Drive'da "Video_Cleaner_Yedek" klasörüne Video_Cleaner_Beta_<sha>_<UTC tarih>.zip olarak koyar,
#   3. Yeni yedek yerindeyse eski Video_Cleaner_Beta_* yedeklerini çöp kutusuna taşır (30 gün geri alınabilir).
# Betik ayrıca saatte bir kendisi de denetler; GitHub'dan tetikleme gelmese bile son commit yedeklenir.
#
# Gereken (bir kez): Secrets → DRIVE_HOOK_URL = <Apps Script web uygulaması URL'si>?key=<HOOK_KEY>
# Sır yoksa iş "atlandı" olarak biter.

name: Video Cleaner Drive Backup

on:
  push:
    branches: [ Video_Cleaner_Beta ]
  workflow_dispatch:

concurrency:
  group: drive-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Kaynak kodu → Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_HOOK: ${{ secrets.DRIVE_HOOK_URL != '' }}
    steps:
      - name: Trigger Drive backup (Apps Script)
        env:
          DRIVE_HOOK_URL: ${{ secrets.DRIVE_HOOK_URL }}
        run: |
          if [ "$HAS_HOOK" != "true" ]; then
            echo "## Drive yedeği atlandı" >> "$GITHUB_STEP_SUMMARY"
            echo "DRIVE_HOOK_URL depo sırrı tanımlı değil (kurulum: .github/scripts/drive_backup.gs başı)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Apps Script yanıtı yönlendirmeyle gelir (-L). Commit API'ye yansısın diye kısa bekleme ve 3 deneme.
          sleep 15
          for attempt in 1 2 3; do
            reply=$(curl -fsSL --max-time 360 "$DRIVE_HOOK_URL" || true)
            echo "deneme $attempt: ${reply:0:300}"
            case "$reply" in
              OK*) break ;;
            esac
            sleep 30
          done
          { echo "## Drive yedeği"; echo '```'; echo "${reply:0:500}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$reply" in
            OK*) exit 0 ;;
            *) echo "::error::Drive yedeği başarısız: ${reply:0:300}"; exit 1 ;;
          esac
