# Video Cleaner — Rust çekirdeği (VC-Core) ve Assembly çekirdekleri.
#
# x86_64 (AVX2) testleri koşucuda yerel, ARM64 (NEON) testleri QEMU kullanıcı kipinde çalışır.
# Her assembly çekirdeği (SAD, seçim kapısı, Haar, 5×5 genişletme, ters alfa karışımı) Rust
# başvurusuyla bit-bit karşılaştırılır. Ayrıca rustfmt ve clippy (masaüstü + Android hedefleri).

name: Video Cleaner Rust Core

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: VC-Core (x86_64 + ARM64/QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
          rustc --version

      - name: Install QEMU and ARM64 cross linker (apt)
        id: apt
        continue-on-error: true
        timeout-minutes: 15
        run: |
          # Koşucularda security.ubuntu.com DNS hatası görüldü: güvenlik deposu da Azure aynasından alınır.
          sudo sed -i -E 's#https?://security.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          # 2 deneme; hata çıktısı görünür kalır. Başarısızsa ARM64 testleri cross (Docker) ile koşar.
          for attempt in 1 2; do
            if timeout 300 sudo apt-get $APT update && timeout 300 sudo apt-get $APT install -y --no-install-recommends --fix-missing qemu-user gcc-aarch64-linux-gnu libc6-dev-arm64-cross; then exit 0; fi
            echo "::warning::apt denemesi $attempt başarısız"
            sleep 15
          done
          exit 1

      - name: Install cross (yedek yol, Docker içinde QEMU + çapraz derleyici)
        if: steps.apt.outcome != 'success'
        run: |
          cargo install cross --locked --version 0.2.5
          cross --version

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (x86_64, Android arm64, Android x86_64)
        run: |
          cargo clippy --release --all-targets -- -D warnings
          cargo clippy --release --all-targets --target aarch64-linux-android -- -D warnings
          cargo clippy --release --all-targets --target x86_64-linux-android -- -D warnings

      - name: Tests x86_64 (AVX2)
        run: cargo test --release

      - name: Tests ARM64 (NEON, QEMU)
        run: |
          if [ "${{ steps.apt.outcome }}" = "success" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER="qemu-aarch64 -L /usr/aarch64-linux-gnu"
            cargo test --release --target aarch64-unknown-linux-gnu
          else
            echo "apt kullanılamadı: ARM64 testleri cross (ghcr.io imajı) ile koşuyor"
            cross test --release --target aarch64-unknown-linux-gnu
          fi
