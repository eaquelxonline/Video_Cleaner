# Video Cleaner — bit hızı kalibrasyonu.
#
# Kalibrasyon kliplerini (AndroidTest/assets/calib) emülatördeki gerçek MediaCodec kodlayıcılarıyla aday
# ayarlarla kodlar (AndroidTest/EncoderCalibrationTest.kt → g_bitrateCalibration), çıktıları çekip
# kaynaklarıyla karşılaştırır: boyut, video/ses bit hızı, PSNR, SSIM, VMAF, kare/FPS/çözünürlük/yön.
# Sonuç tablosu iş özetine, CSV ve çıktılar artifact olarak yüklenir.
#
# Not: emülatörde yalnızca yazılım kodlayıcıları (c2.android.*, OMX.google.*) vardır. Donanım
# kodlayıcıları farklı sonuç verir; bu tablo evrensel sabit değil, politikayı seçmek için kanıttır.

name: Video Cleaner Bitrate Calibration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Kotlin/Core.kt'
      - 'AndroidTest/**'
      - 'AndroidTest/assets/calib/**'
      - '.github/workflows/bitrate-calibration.yml'
      - '.github/scripts/calibration_metrics.py'

concurrency:
  group: bitrate-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    name: Kalibrasyon API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        api-level: ['30', '34']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache cargo-ndk
        id: cargo-ndk
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Encode calibration clips on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb logcat -G 32M || true
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.videocleaner.engine.EncoderCalibrationTest -Pandroid.testInstrumentationRunnerArguments.calibrate=true --stacktrace || touch test-failed
            adb logcat -d -s VCCAL:I VCCAPS:I VideoCleaner:I AndroidRuntime:E > calib-logcat.txt || true
            mkdir -p calib-out && adb pull /sdcard/Movies/VideoCleanerCalib calib-out || true
            test ! -f test-failed

      - name: Build libvmaf (Netflix v3.2.1, sabit)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg meson ninja-build nasm xxd > /dev/null
          git clone --depth 1 --branch v3.2.1 https://github.com/Netflix/vmaf.git "$RUNNER_TEMP/vmaf"
          meson setup "$RUNNER_TEMP/vmaf/libvmaf/build" "$RUNNER_TEMP/vmaf/libvmaf" --buildtype release -Denable_float=true > /dev/null
          ninja -C "$RUNNER_TEMP/vmaf/libvmaf/build" > /dev/null
          "$RUNNER_TEMP/vmaf/libvmaf/build/tools/vmaf" --version

      - name: Measure quality and size
        run: |
          out=$(find calib-out -name '*.mp4' -printf '%h\n' | head -1)
          python3 .github/scripts/calibration_metrics.py \
            --logcat calib-logcat.txt --outputs "${out:-calib-out}" --sources AndroidTest/assets/calib \
            --vmaf "$RUNNER_TEMP/vmaf/libvmaf/build/tools/vmaf" \
            --label "emülatör API ${{ matrix.api-level }} (yazılım kodlayıcı)" \
            --csv calibration-api${{ matrix.api-level }}.csv --markdown calibration-api${{ matrix.api-level }}.md
          {
            echo "# API ${{ matrix.api-level }}"
            echo '```'
            grep -E 'VCCAPS' calib-logcat.txt | sed -E 's/^.*VCCAPS *: //' || true
            echo '```'
            cat calibration-api${{ matrix.api-level }}.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload calibration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bitrate-calibration-api${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            calib-logcat.txt
            calibration-api*.csv
            calibration-api*.md
            calib-out/
