# Video Cleaner — gerçek Android telefonlarda doğrulama (Firebase Test Lab).
#
# Uygulama ve cihaz testleri Test Lab'deki fiziksel telefonlarda, telefonun kendi (donanım) kodlayıcılarıyla
# koşar. Kalibrasyon klipleri Standart ve Yüksek profillerle kodlanır; çıktılar ve logcat geri çekilir ve
# emülatördeki ile aynı betikle ölçülür: istenen/gerçek bit hızı, kare kare PTS, SAR/yön, ses paketleri,
# renk (colr ve VUI ayrı), VMAF (libvmaf v3.2.1; v0.6.1 + v0.6.1neg; ort/min/%5/%10), PSNR, SSIM.
#
# Gerekenler (bir kez, depo ayarlarında):
#   Secrets → GCP_SA_KEY      : Test Lab yetkili hizmet hesabının JSON anahtarı
#   Variables → GCP_PROJECT_ID: Firebase/Google Cloud proje kimliği (isteğe bağlı; yoksa JSON'daki project_id)
# Sır yoksa iş "atlandı" olarak biter (özet hangi adın görünmediğini yazar); diğer iş akışlarını etkilemez.
#
# Yalnızca elle çalışır (Actions → Run workflow): Spark planında günde 5 fiziksel cihaz testi hakkı var ve
# her cihaz bir test sayılır; her push'ta çalışması kotayı tüketirdi.

name: Video Cleaner Real Device Test

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Elle cihaz listesi (boşsa otomatik seçilir). Örnek: model=tokay,version=35;model=a51,version=30"
        required: false
        default: ""
      reuse_results:
        description: "Önceki koşunun sonuçları (gs://…/video-cleaner/<run>-<attempt>). Verilirse cihazda test KOŞULMAZ (kota harcanmaz), yalnızca indirilip ölçülür."
        required: false
        default: ""
      max_devices:
        description: "Otomatik seçimde en fazla cihaz (Spark planı: günde 5 fiziksel test)"
        required: false
        default: "3"

concurrency:
  group: firebase-device-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devices:
    name: Gerçek cihazlar (Firebase Test Lab)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_PROJECT_VAR: ${{ vars.GCP_PROJECT_ID != '' }}
      HAS_PROJECT_SECRET: ${{ secrets.GCP_PROJECT_ID != '' }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          # Değerler yazdırılmaz; yalnızca tanımlı olup olmadıkları raporlanır.
          echo "GCP_SA_KEY sırrı: $HAS_KEY · GCP_PROJECT_ID değişkeni: $HAS_PROJECT_VAR · GCP_PROJECT_ID sırrı: $HAS_PROJECT_SECRET"
          if [ "$HAS_KEY" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Gerçek cihaz testi atlandı"
              echo "Bu iş akışı **GCP_SA_KEY** adlı depo sırrını göremiyor (Settings → Secrets and variables → Actions → **Repository secrets**)."
              echo "Ortam (Environment) sırrı, Codespaces veya Dependabot sırrı olarak eklenen anahtar buradan görünmez."
              echo
              echo "| ad | tanımlı mı |"
              echo "|---|---|"
              echo "| GCP_SA_KEY (secret) | $HAS_KEY |"
              echo "| GCP_PROJECT_ID (variable) | $HAS_PROJECT_VAR |"
              echo "| GCP_PROJECT_ID (secret) | $HAS_PROJECT_SECRET |"
              echo
              echo "Proje kimliği zorunlu değildir: verilmezse JSON anahtarındaki project_id kullanılır."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.skip == 'false'
        uses: actions/checkout@v7

      - name: Set up Java 21
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache cargo-ndk
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        id: cargo-ndk
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == '' && steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Gradle
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      - name: Set up Python
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Export untrained models (inference skeleton)
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        run: |
          # Eğitilmemiş (sabit tohumlu) üç model ONNX'e aktarılır ve test APK'sına konur; telefonda
          # ZzInferenceSkeletonTest operatör uyumluluğunu, süreyi ve belleği ölçer (bench=true).
          python -m pip install --quiet torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet onnx==1.23.2 onnxscript onnxruntime==1.30.0 numpy sympy packaging imageio-ffmpeg
          # Hibrit grafikler: kare başına kodlayıcı/çözücü + 30 karelik zamansal çekirdek; FP32 ve FP16.
          python Models/Export.py --out AndroidTest/assets/onnx
          # Statik QDQ INT8 (simetrik, kanal başına; kalibrasyon: calib/c01–c08). Bellek için grafik başına
          # ayrı süreç; çekirdekler küçük kopyada kalibre edilip aralık önbelleğiyle nicemlenir.
          for g in det_enc det_core det_dec flow_enc flow_pair mamba_enc mamba_core mamba_dec; do
            case $g in *core) lim=2; clips=c01,c05;; *) lim=32; clips=c01,c02,c03,c04,c05,c06,c07,c08;; esac
            python Models/Quantize.py --onnx AndroidTest/assets/onnx --only $g --clips $clips --limit $lim || echo "::warning::$g INT8 üretilemedi"
          done
          rm -f AndroidTest/assets/onnx/*_ranges.json AndroidTest/assets/onnx/quantize_report.json
          ls -la AndroidTest/assets/onnx
          { echo "## Dışa aktarılan hibrit grafikler"; echo '```'; python -c "import json;[print(d['name'],'düğüm',d['nodes'],'fp32',d['fp32_mb'],'MB fp16',d['fp16_mb'],'MB') for d in json.load(open('AndroidTest/assets/onnx/export_report.json'))]"; ls -la AndroidTest/assets/onnx/*_int8.onnx; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APKs
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest verifyDebugApkAlignment --stacktrace
          echo "APP_APK=$(find build/outputs/apk/debug -name '*.apk' | head -1)" >> "$GITHUB_ENV"
          echo "TEST_APK=$(find build/outputs/apk/androidTest -name '*.apk' | head -1)" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        if: steps.creds.outputs.skip == 'false'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: steps.creds.outputs.skip == 'false'
        uses: google-github-actions/setup-gcloud@v2

      - name: Pick physical devices
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        run: |
          project="${{ vars.GCP_PROJECT_ID }}"
          [ -n "$project" ] || project="${{ secrets.GCP_PROJECT_ID }}"
          [ -n "$project" ] || project="${{ steps.auth.outputs.project_id }}"
          [ -n "$project" ] || { echo "::error::Proje kimliği bulunamadı (değişken, sır veya JSON anahtarı)"; exit 1; }
          gcloud config set project "$project"
          if [ -n "${{ inputs.devices }}" ]; then
            echo "${{ inputs.devices }}" | tr ';' '\n' | sed 's/^/--device=/' > devices.txt
          else
            gcloud firebase test android models list --format=json > models.json
            echo "models.json: $(wc -c < models.json) bayt"
            python3 .github/scripts/ftl_pick_devices.py models.json "${{ inputs.max_devices || '3' }}" devices.txt | tee devices-human.txt
          fi
          { echo "## Seçilen cihazlar"; echo '```'; cat devices-human.txt 2>/dev/null || cat devices.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Run on Firebase Test Lab
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        run: |
          set +e
          gcloud firebase test android run \
            --type instrumentation \
            --app "$APP_APK" --test "$TEST_APK" \
            $(cat devices.txt) \
            --environment-variables calibrate=true,calibrateCandidates=policy_std+policy_high+policy_std_hevc,bench=true \
            --directories-to-pull /sdcard/Movies \
            --results-dir "video-cleaner/${{ github.run_id }}-${{ github.run_attempt }}" \
            --timeout 45m --no-record-video --no-performance-metrics 2>&1 | tee ftl.log
          echo "FTL_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          bucket=$(grep -oE 'gs://[^] ]+|storage/browser/[^] ]+' ftl.log | head -1 | sed 's#storage/browser/#gs://#; s#/$##')
          echo "RESULTS_GS=$bucket" >> "$GITHUB_ENV"

      - name: Download results
        if: steps.creds.outputs.skip == 'false'
        run: |
          if [ -n "${{ inputs.reuse_results }}" ]; then
            gcloud config set project "${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || steps.auth.outputs.project_id }}" > /dev/null 2>&1 || true
            RESULTS_GS="${{ inputs.reuse_results }}"
            echo "RESULTS_GS=$RESULTS_GS" >> "$GITHUB_ENV"
            echo "FTL_EXIT=reuse" >> "$GITHUB_ENV"
            echo "Önceki sonuçlar yeniden kullanılıyor: $RESULTS_GS (cihaz kotası harcanmadı)" >> "$GITHUB_STEP_SUMMARY"
          fi
          [ -n "$RESULTS_GS" ] || { echo "::error::Sonuç klasörü (gs://) bulunamadı"; exit 1; }
          mkdir -p ftl-results
          gsutil -m -q cp -r "$RESULTS_GS/*" ftl-results/ || echo "::warning::gsutil indirmesi tam değil"
          echo "İndirilen klasörler:"; find ftl-results -maxdepth 2 -type d | sort
          echo "Dosya sayısı: $(find ftl-results -type f | wc -l)"

      - name: Build libvmaf (Netflix v3.2.1, sabit)
        timeout-minutes: 40
        if: steps.creds.outputs.skip == 'false'
        run: |
          # Koşucularda security.ubuntu.com DNS hatası görüldü: güvenlik deposu da Azure aynasından alınır.
          sudo sed -i -E 's#https?://security.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          # Paket sunucusuna geçici erişim hatalarına karşı 3 deneme; her deneme en çok 10 dk.
          ok=0
          for attempt in 1 2 3; do
            if timeout 600 sudo apt-get $APT update -qq && timeout 600 sudo apt-get $APT install -y -qq --fix-missing ffmpeg meson ninja-build nasm xxd python3-numpy > /dev/null; then ok=1; break; fi
            echo "apt denemesi $attempt başarısız; 20 sn sonra yeniden"; sleep 20
          done
          [ "$ok" = 1 ]
          git clone --depth 1 --branch v3.2.1 https://github.com/Netflix/vmaf.git "$RUNNER_TEMP/vmaf"
          meson setup "$RUNNER_TEMP/vmaf/libvmaf/build" "$RUNNER_TEMP/vmaf/libvmaf" --buildtype release -Denable_float=true > /dev/null
          ninja -C "$RUNNER_TEMP/vmaf/libvmaf/build" > /dev/null

      - name: Measure each device
        if: steps.creds.outputs.skip == 'false'
        run: |
          set +e
          mkdir -p device-raw device-outputs
          for dev in ftl-results/*/; do
            name=$(basename "$dev")
            echo "=== $name"
            # Ham kanıt: ana logcat, sonuç XML'i, enstrümantasyon çıktısı, çökme ve tombstone dosyaları
            mkdir -p "device-raw/$name"
            find "$dev" -maxdepth 1 -type f \( -name 'logcat' -o -name 'test_result_*.xml' -o -name 'instrumentation.results' \
              -o -iname '*crash*' -o -iname '*tombstone*' -o -iname '*anr*' \) -exec cp {} "device-raw/$name/" \;
            ls -l "device-raw/$name"
            log="$dev/logcat"
            [ -f "$log" ] || log=$(find "$dev" -name 'logcat' | head -1)
            if [ -z "$log" ] || [ ! -f "$log" ]; then
              echo "$name: logcat yok" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            grep -aE 'VCCAL|VCCAPS|VCTEST|VCDIAG|AndroidRuntime|DEBUG   :|libc    :' "$log" > "device-$name.log"
            echo "$name: $(wc -l < "device-$name.log") ilgili logcat satırı"
            out=$(find "$dev" -type d -name VideoCleanerCalib | head -1)
            if [ -n "$out" ]; then
              cp -r "$out" "device-outputs/$name"
              python3 .github/scripts/calibration_metrics.py \
                --logcat "device-$name.log" --outputs "$out" --sources AndroidTest/assets/calib \
                --vmaf "$RUNNER_TEMP/vmaf/libvmaf/build/tools/vmaf" --label "$name (gerçek cihaz)" \
                --csv "device-$name.csv" --markdown "device-$name.md"
              echo "$name: ölçüm betiği çıkış kodu $?"
            else
              echo "$name: kalibrasyon çıktısı yok (yalnızca test özeti)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            {
              echo "## $name"
              cat "device-$name.md" 2>/dev/null
              echo; echo "### Test sonuçları ve özet satırları ($name)"; echo '```'
              python3 .github/scripts/junit_summary.py "$dev"/test_result_*.xml 2>/dev/null
              grep -aE 'VCCAPS|VCDIAG|VCTEST.*(DEVICE|SUMMARY|VIDEO|BITRATE|SERVICE|PIXELS|VCCORE|VCAUDIT|REMUX|HBDECODE|CODECS|AV1ENCODE|RUNTIME|CHECKPOINT|AUDIOPROBE)' "device-$name.log" | sed -E 's/^.*(VCCAPS|VCDIAG|VCTEST) *: //'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - name: Upload device results
        if: always() && steps.creds.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: real-device-results
          if-no-files-found: warn
          path: |
            ftl.log
            models.json
            devices*.txt
            device-*.csv
            device-*.md
            device-*.log
            device-raw/

      - name: Upload device outputs (encoded videos)
        if: always() && steps.creds.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: real-device-outputs
          if-no-files-found: ignore
          path: device-outputs/

      - name: Fail if tests failed on a device
        if: steps.creds.outputs.skip == 'false' && inputs.reuse_results == ''
        run: test "${FTL_EXIT:-1}" = "0"
